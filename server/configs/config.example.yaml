# Example configuration. Every key is optional; built-in defaults are shown.
# Precedence: defaults < this file (-config / ADMIN_CONFIG) < ADMIN_* env vars,
# e.g. http.addr -> ADMIN_HTTP_ADDR, database.max_open_conns -> ADMIN_DATABASE_MAX_OPEN_CONNS.
# Unknown keys are rejected, and durations need a unit ("5s", not 5).
#
# Secrets are rejected if present in this file:
#   ADMIN_DATABASE_URL    postgres://user:pass@host:5432/db?sslmode=require   (required)
#   ADMIN_REDIS_PASSWORD
#   ADMIN_BOOTSTRAP_ADMIN_PASSWORD   creates the first super admin (12–72 characters)
#   ADMIN_FILE_SIGNING_KEY, ADMIN_FILE_S3_ACCESS_KEY, ADMIN_FILE_S3_SECRET_KEY (see file below)
#
# This file lists every non-secret key with its default
# (internal/platform/config/config_example_test.go keeps it complete).

app:
  name: base-admin
  env: dev # dev | test | prod

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  request_timeout: 20s      # must be shorter than write_timeout
  max_body_bytes: 2097152   # 2 MiB
  drain_delay: 0s           # set to e.g. 5s behind a load balancer
  shutdown_timeout: 30s
  trusted_proxies: []       # IPs/CIDRs allowed to set X-Forwarded-For

database:
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  connect_timeout: 5s
  statement_timeout: 15s    # 0 disables; migrations always run without it
  slow_query_threshold: 200ms
  # Extra databases of business modules (docs/module-guide.md): the URL comes
  # from ADMIN_DATABASE_EXTRA_<NAME>_URL; optional pool settings here, e.g.
  # extra:
  #   game:
  #     max_open_conns: 10
  #     required: false        # true: no start and not ready while unreachable

redis:
  addr: 127.0.0.1:6379
  db: 0
  pool_size: 20
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  require_safe_eviction_policy: true  # reject allkeys-* (design doc 6.5.6)
  declared_eviction_policy: ""        # required when the server disables CONFIG (managed Redis)

log:
  level: info    # debug | info | warn | error
  format: json   # json | console

metrics:
  enabled: true
  addr: 127.0.0.1:9090  # keep off the public network

auth:
  # Session cookie. In prod use "__Host-sid" (requires cookie_secure: true,
  # i.e. HTTPS); prod rejects an insecure cookie.
  cookie_name: sid
  cookie_secure: true       # false only for local http development
  # Browser origins (scheme://host[:port]) allowed to send state-changing
  # requests; in prod list the real frontend origin(s) only.
  allowed_origins:
    - http://localhost:8848
    - http://127.0.0.1:8848
  idle_timeout: 2h          # session ends after this long without requests
  absolute_timeout: 12h     # and at the latest this long after login
  touch_interval: 1m        # how often the sliding expiry is written back
  snapshot_ttl: 10m         # cached permission snapshot lifetime
  reconcile_interval: 10s   # PG/Redis session-generation consistency check
  lock_timeout: 3s          # wait for a user row lock in login/revocation
  login_window: 5m          # login rate-limit window
  login_max_per_ip: 50      # attempts per IP per window
  login_max_per_account: 10 # attempts per account per window

bootstrap:
  # The first super admin is created when no user exists, with the password
  # from ADMIN_BOOTSTRAP_ADMIN_PASSWORD; it must be changed at first login.
  admin_username: admin

file:
  driver: local              # local | s3
  local_dir: data/uploads    # local driver only
  signed_url_ttl: 10m        # signed download links (1s–7d)
  max_upload_bytes: 104857600  # hard ceiling (100 MiB); 基础设置 can only lower it
  s3:
    endpoint: ""             # host:port, no scheme, e.g. minio:9000 or s3.amazonaws.com
    region: ""
    bucket: ""
    use_ssl: true
    use_path_style: false    # true for MinIO
  # Secrets, environment only:
  #   ADMIN_FILE_SIGNING_KEY   at least 32 bytes; required in prod
  #   ADMIN_FILE_S3_ACCESS_KEY / ADMIN_FILE_S3_SECRET_KEY  (omit both to use the AWS/MinIO env or instance role)

# Configuration of business modules, decoded by each module with
# cfg.Biz.Decode (docs/module-guide.md). Secrets come from ADMIN_BIZ_<KEY>,
# levels separated by a double underscore: ADMIN_BIZ_GAME__INNER_TOKEN.
# biz:
#   game:
#     grpc_addr: game-server:9000
