# Production-style stack: PostgreSQL, Redis, a one-shot migration job, the
# API and the web/nginx front end. Copy deploy/docker/prod.env.example to
# deploy/docker/prod.env and fill in the secrets first.
#
#   docker compose -f deploy/docker/compose.prod.yaml --env-file deploy/docker/prod.env up -d --build
#
# TLS: terminate HTTPS in front of the `web` service (load balancer, ingress,
# or a reverse proxy). Session cookies are Secure in prod and need HTTPS.
name: base-admin

x-api-env: &api-env
  ADMIN_APP_ENV: prod
  ADMIN_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  ADMIN_REDIS_ADDR: redis:6379
  ADMIN_REDIS_PASSWORD: ${REDIS_PASSWORD}
  ADMIN_HTTP_ADDR: ":8080"
  ADMIN_HTTP_DRAIN_DELAY: 5s
  # Only the nginx container (on this subnet) may set X-Forwarded-For.
  ADMIN_HTTP_TRUSTED_PROXIES: 172.30.0.0/24
  ADMIN_METRICS_ADDR: "0.0.0.0:9090"
  ADMIN_AUTH_COOKIE_NAME: __Host-sid
  ADMIN_AUTH_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
  ADMIN_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  ADMIN_FILE_DRIVER: local
  ADMIN_FILE_LOCAL_DIR: /data/files
  ADMIN_FILE_SIGNING_KEY: ${FILE_SIGNING_KEY}

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    # Design doc 6.5.6: AOF on; keys without TTL are never evicted.
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  migrate:
    build:
      context: ../../server
      args:
        VERSION: ${APP_VERSION:-dev}
    image: base-admin-api:latest
    command: ["migrate", "up"]
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    restart: "no"

  api:
    image: base-admin-api:latest
    restart: unless-stopped
    environment: *api-env
    volumes: [files:/data/files]
    # /health/ready checks PostgreSQL and Redis; the distroless image has no
    # shell, so the binary probes itself.
    healthcheck:
      test: ["CMD", "/admin", "health", "ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]            # large multipart forms spill here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [backend]

  web:
    build: ../../web
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
    ports: ["${WEB_PORT:-80}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  files:

networks:
  backend:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
