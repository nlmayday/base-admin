# Local development dependencies. Credentials here are for local use only.
# Ports are bound to 127.0.0.1 and offset to avoid clashing with local
# PostgreSQL/Redis installs.
name: base-admin-dev

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: base_admin
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d base_admin"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.0-alpine
    # Matches design doc 6.5.6: AOF on, keys without TTL never evicted.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
