name: security

# Vulnerability scans. Not a merge gate: a fix may not be released yet (e.g.
# a Go patch version), and Dependabot opens the upgrade PRs. Failures show
# up on main and in the weekly run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: govulncheck (only vulnerabilities the code can reach)
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level moderate
