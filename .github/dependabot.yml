# Weekly dependency and base-image updates, grouped to keep PRs few.
# Major versions are ignored: they need a deliberate, tested upgrade
# (e.g. PostgreSQL 17 → 18, Node 22 → 25), not a weekly bot PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: weekly}
    groups:
      go-deps: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web-patch-minor:
        update-types: [patch, minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /server
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /web
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
